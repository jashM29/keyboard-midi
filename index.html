<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#0d0e12">
    
    <title>JDAW V27 (Pro Engine)</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg: #0d0e12; --chassis: #15161b; --panel: #1b1c23; 
            --border: #282a36; --screen: #0a0b0d; 
            --fl-orange: #ff6a00; --fl-green: #00e676; --fl-blue: #00bfff; --fl-red: #ff3366;
            --text-main: #f8fafc; --text-muted: #64748b;
        }

        body { 
            background: var(--bg); color: var(--text-main); font-family: 'Inter', sans-serif; 
            display: flex; flex-direction: column; align-items: center; padding: 10px; margin: 0; min-height: 100vh;
            overscroll-behavior-y: contain; user-select: none;
        }

        #status-bar { 
            width: 100%; max-width: 1200px; box-sizing: border-box; text-align: center; padding: 8px; 
            background: #8b0000; color: white; border-radius: 4px; margin-bottom: 10px; 
            font-weight: 900; font-size: 0.7rem; letter-spacing: 2px; text-transform: uppercase;
            box-shadow: 0 0 10px rgba(139, 0, 0, 0.5); z-index: 100;
        }

        .daw-chassis {
            background: var(--chassis); border: 1px solid #222; border-top: 1px solid #333;
            border-radius: 12px; padding: 15px; box-shadow: 0 20px 40px rgba(0,0,0,0.8);
            width: 100%; max-width: 1200px; box-sizing: border-box; display: grid; gap: 15px;
        }

        @media (min-width: 900px) {
            .daw-chassis { grid-template-columns: 1fr 1fr; padding: 25px; gap: 20px; }
            .full-width { grid-column: 1 / -1; }
        }

        /* DIGITAL TRANSPORT CONSOLE */
        .master-console {
            background: var(--screen); border: 2px solid #000; border-radius: 8px; padding: 15px;
            display: flex; flex-direction: column; gap: 15px; box-shadow: inset 0 0 20px rgba(0,0,0,0.9);
        }
        @media (min-width: 600px) { .master-console { flex-direction: row; justify-content: space-between; align-items: center; } }

        .oled-group { display: flex; gap: 20px; justify-content: space-between; width: 100%; }
        .oled-block { display: flex; flex-direction: column; font-family: 'Share Tech Mono', monospace; }
        .oled-lbl { color: #516b80; font-size: 0.6rem; font-family: 'Inter', sans-serif; font-weight: 900; letter-spacing: 1px; margin-bottom: 2px;}
        .oled-val { color: var(--fl-blue); font-size: 1.5rem; text-shadow: 0 0 8px rgba(0,191,255,0.5); }
        .oled-val.orange { color: var(--fl-orange); text-shadow: 0 0 8px rgba(255,106,0,0.5); }

        .transport-controls { display: flex; gap: 10px; width: 100%; justify-content: center; }
        .t-btn {
            background: linear-gradient(180deg, #2a2c36, #1b1c23); border: 1px solid #000; border-top: 1px solid #444; 
            color: #fff; border-radius: 6px; flex-grow: 1; height: 45px; font-size: 1.2rem; cursor: pointer; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.6); touch-action: manipulation;
        }
        .t-btn:active { transform: translateY(2px); box-shadow: 0 1px 2px rgba(0,0,0,0.8); }
        .t-btn.rec.active { background: #3a000d; border-color: var(--fl-red); color: var(--fl-red); box-shadow: 0 0 15px rgba(255,51,102,0.4); }
        .t-btn.play.active { background: #002b16; border-color: var(--fl-green); color: var(--fl-green); box-shadow: 0 0 15px rgba(0,230,118,0.4); }

        /* MODULE BLOCKS */
        .module { background: var(--panel); border: 1px solid #000; border-top: 1px solid #2a2c36; border-radius: 8px; padding: 15px; box-shadow: inset 0 2px 10px rgba(0,0,0,0.5); }
        .m-title { display: flex; justify-content: space-between; align-items: center; font-size: 0.65rem; color: #828a9f; letter-spacing: 1px; font-weight: 900; border-bottom: 1px solid #282a36; padding-bottom: 6px; margin-bottom: 12px; }

        /* MPC PADS */
        .pad-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
        .pad {
            background: linear-gradient(135deg, #282a36, #1b1c23); border: 1px solid #111; border-top: 1px solid #3a3d4a; 
            border-radius: 4px; height: 50px; display: flex; justify-content: center; align-items: center; 
            cursor: pointer; box-shadow: 0 3px 5px rgba(0,0,0,0.5); font-weight: 900; color: var(--text-muted); 
            font-size: 0.7rem; touch-action: manipulation;
        }
        .pad:active { transform: translateY(2px); box-shadow: 0 1px 2px rgba(0,0,0,0.8); }
        
        .pad.selected { border-color: var(--fl-blue); color: #fff; box-shadow: 0 0 10px rgba(0,191,255,0.3); }
        .pad.s-ARMED { border-color: var(--fl-red); background: #2a0008; color: var(--fl-red); }
        .pad.s-RECORDING { background: var(--fl-red); color: #fff; box-shadow: 0 0 15px rgba(255,51,102,0.6); border-color: #ffb3c6;}
        .pad.s-OVERDUB { background: var(--fl-orange); color: #000; box-shadow: 0 0 15px rgba(255,106,0,0.6); border-color: #ffe6cc;}
        .pad.s-PLAYING { background: var(--fl-green); color: #000; box-shadow: 0 0 15px rgba(0,230,118,0.5); border-color: #ccffcc;}
        .pad.s-STOPPED { color: var(--fl-green); border-color: var(--fl-green); }

        .pad-reg.saved { border-color: #664400; color: var(--fl-orange); background: #2a1a00; }

        .btn-small { background: #222; color: #fff; border: 1px solid #111; border-top: 1px solid #444; border-radius: 4px; padding: 5px 10px; font-size: 0.6rem; font-weight: 900; cursor: pointer; }
        .btn-small.active { background: var(--fl-red); color: #fff; border-color: #ffb3c6; box-shadow: 0 0 10px rgba(255,51,102,0.5);}

        /* MIXER & SYNTH */
        .strip-input { -webkit-appearance: none; width: 100%; height: 6px; background: #000; border-radius: 3px; border: 1px solid #111; outline: none; touch-action: none; }
        .strip-input::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 20px; background: #ddd; border: 2px solid var(--fl-orange); border-radius: 2px; box-shadow: 0 0 8px rgba(255,106,0,0.6); margin-top: -7px;}

        .mixer-scroll { display: flex; gap: 15px; overflow-x: auto; padding: 10px 5px 15px 5px; scroll-snap-type: x mandatory; -webkit-overflow-scrolling: touch; }
        .fader-wrap { display: flex; flex-direction: column; align-items: center; width: 40px; flex-shrink: 0; scroll-snap-align: start; }
        .fader-bg { position: relative; width: 30px; height: 130px; display: flex; justify-content: center; align-items: center; background: #08080a; border-radius: 3px; box-shadow: inset 0 0 8px #000; border: 1px solid #1a1a1a;}
        .fader-input { -webkit-appearance: none; width: 120px; height: 2px; background: transparent; transform: rotate(-90deg); position: absolute; z-index: 2; touch-action: none; }
        .fader-input::-webkit-slider-thumb { -webkit-appearance: none; width: 28px; height: 40px; background: linear-gradient(to right, #1a1a1a, #333, #1a1a1a); border: 1px solid #000; border-top: 1px solid #555; border-radius: 2px; box-shadow: 0 5px 10px rgba(0,0,0,0.8); background-image: linear-gradient(to bottom, transparent 46%, var(--fl-blue) 46%, var(--fl-blue) 54%, transparent 54%); }
        .fader-val { margin-top: 8px; font-size: 0.65rem; color: var(--fl-blue); font-family: monospace; background: #000; padding: 2px 4px; border-radius: 2px; border: 1px solid #222;}
    </style>
</head>
<body>

    <div id="status-bar">MIDI DISCONNECTED</div>

    <div class="daw-chassis">
        
        <!-- MASTER CONSOLE -->
        <div class="master-console full-width">
            <div class="oled-group">
                <div class="oled-block">
                    <span class="oled-lbl">MASTER CLOCK</span>
                    <span class="oled-val orange" id="master-time">0.00s</span>
                </div>
                <div class="oled-block">
                    <span class="oled-lbl">CASIO TONE</span>
                    <span class="oled-val" id="current-tone">---</span>
                </div>
                <div class="oled-block">
                    <span class="oled-lbl">EDIT TARGET</span>
                    <span class="oled-val" id="display-active-track" style="color:#fff;">TRK 1</span>
                </div>
            </div>
            <div class="transport-controls">
                <button class="t-btn rec" id="loop-rec" onclick="toggleLooperRec()">⏺</button>
                <button class="t-btn play" id="loop-play" onclick="toggleLooperPlay()">⏵</button>
                <button class="t-btn stop" onclick="stopAllTracks()">⏹</button>
            </div>
        </div>

        <!-- LEFT COL: LOOPER & REG -->
        <div style="display: flex; flex-direction: column; gap: 15px;">
            <div class="module" style="border-top-color: var(--fl-green);">
                <div class="m-title">
                    <span style="color:var(--fl-green);">16-TRACK MASTER SEQUENCER</span>
                    <span id="looper-status" style="color:#fff;">READY</span>
                </div>
                <div class="pad-grid" id="tracks-container"></div>
            </div>

            <div class="module" style="border-top-color: var(--fl-orange);">
                <div class="m-title">
                    <span style="color:var(--fl-orange);">REGISTRATION SNAPSHOTS</span>
                    <button id="btn-reg-store" class="btn-small" onclick="toggleStoreMode()">STORE</button>
                </div>
                <div class="pad-grid" id="reg-container"></div>
            </div>
        </div>

        <!-- RIGHT COL: MIXER & SYNTH -->
        <div style="display: flex; flex-direction: column; gap: 15px;">
            <div class="module" style="border-top-color: var(--fl-blue);">
                <div class="m-title"><span style="color:var(--fl-blue);">CONSOLE MIXER ➔</span></div>
                <div class="mixer-scroll" id="sliders-container"></div>
            </div>

            <div style="display: grid; grid-template-columns: 100px 1fr; gap: 15px;">
                <div class="module" style="border-top-color: #fff; padding: 10px;">
                    <div class="m-title">TEMPO</div>
                    <span id="bpm-val" class="oled-val orange" style="font-size:1.1rem; display:block; margin-bottom:5px;">100</span>
                    <input type="range" class="strip-input" id="bpm-slider" min="60" max="200" value="100" oninput="updateTempo()" style="margin-bottom: 15px;">
                    <button class="btn-small" id="metro-btn" onclick="toggleMetronome()" style="width:100%;">METRO OFF</button>
                </div>

                <div class="module" style="border-top-color: #fff;">
                    <div class="m-title">SYNTHESIS ENGINE</div>
                    <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px;" id="knobs-container"></div>
                </div>
            </div>
        </div>

    </div>

    <script>
        // ==========================================
        // === V27 GLOBAL DAW ARCHITECTURE ==========
        // ==========================================
        let midiOutput = null; 
        let activeTrackIndex = 0; 
        let globalCurrentTone = "---"; 
        
        // AUDIO & MASTER CLOCK
        let audioCtx = null;
        let isMetroOn = false; 
        let metroBeat = 0;
        let nextAudioTime = 0; 
        
        // THE MASTER TRANSPORT VARIABLES
        let globalTransportStart = null; 
        let isTransportRunning = false;

        function getGlobalTime() {
            if (!audioCtx) return 0;
            return audioCtx.currentTime * 1000; // Return strict hardware milliseconds
        }

        // PARAMETER MAPS
        const knobMappings = [
            { id: "K1", name: "Cutoff", cc: 74, default: 64 }, { id: "K2", name: "Reso", cc: 71, default: 64 },
            { id: "K3", name: "Attack", cc: 73, default: 64 }, { id: "K4", name: "Decay", cc: 75, default: 64 },
            { id: "K5", name: "Release", cc: 72, default: 64 }, { id: "K6", name: "Vibrato", cc: 76, default: 64 }
        ];

        const sliderMappings = [
            { id: "S1", name: "Vol", cc: 7, default: 100 }, { id: "S2", name: "Pan", cc: 10, default: 64 },
            { id: "S3", name: "Reverb", cc: 91, default: 40 }, { id: "S4", name: "Chorus", cc: 93, default: 0 },
            { id: "S5", name: "Mod", cc: 1, default: 0 }, { id: "S6", name: "Expr", cc: 11, default: 127 },
            { id: "S7", name: "VibDep", cc: 77, default: 64 }, { id: "S8", name: "VibDel", cc: 78, default: 64 }
        ];

        function getDefaultParams() {
            let p = {};
            knobMappings.forEach(k => p[k.cc] = k.default);
            sliderMappings.forEach(s => p[s.cc] = s.default);
            return p;
        }

        // UI SETUP
        const knobsContainer = document.getElementById('knobs-container');
        knobMappings.forEach(k => {
            knobsContainer.innerHTML += `
                <div style="display:flex; flex-direction:column; gap:4px;">
                    <div style="display:flex; justify-content:space-between; font-size:0.6rem; color:#888; font-weight:900;"><span>${k.name}</span> <span id="display-${k.id}" style="color:var(--fl-orange);">${k.default}</span></div>
                    <input type="range" class="strip-input" id="${k.id}" min="0" max="127" value="${k.default}" oninput="handleControlMove('${k.id}', ${k.cc}, this.value)">
                </div>`;
        });

        const slidersContainer = document.getElementById('sliders-container');
        sliderMappings.forEach(s => {
            slidersContainer.innerHTML += `
                <div class="fader-wrap">
                    <span style="font-size:0.55rem; color:#888; font-weight:900; margin-bottom:8px;">${s.name}</span>
                    <div class="fader-bg"><input type="range" class="fader-input" id="${s.id}" min="0" max="127" value="${s.default}" oninput="handleControlMove('${s.id}', ${s.cc}, this.value)"></div>
                    <span id="display-${s.id}" class="fader-val">${s.default}</span>
                </div>`;
        });

        function syncUIToTrack(trackObj) {
            knobMappings.forEach(k => { let val = trackObj.params[k.cc]; document.getElementById(k.id).value = val; document.getElementById(`display-${k.id}`).innerText = val; });
            sliderMappings.forEach(s => { let val = trackObj.params[s.cc]; document.getElementById(s.id).value = val; document.getElementById(`display-${s.id}`).innerText = val; });
        }

        function handleControlMove(controlId, ccNumber, value) {
            document.getElementById(`display-${controlId}`).innerText = value; let val = parseInt(value);
            let t = tracks[activeTrackIndex]; t.params[ccNumber] = val; 
            if (midiOutput) midiOutput.send([0xB0 | t.channel, ccNumber, val]);
        }

        function initAudio() { 
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); 
            if (audioCtx.state === 'suspended') audioCtx.resume(); 
        }

        function playClick(isDownbeat, scheduleTime) {
            if (!audioCtx) return; 
            const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination); 
            osc.type = "square"; osc.frequency.value = isDownbeat ? 1000 : 500;
            gain.gain.setValueAtTime(0.1, scheduleTime); 
            gain.gain.exponentialRampToValueAtTime(0.001, scheduleTime + 0.05);
            osc.start(scheduleTime); osc.stop(scheduleTime + 0.05);
        }

        function toggleMetronome() {
            initAudio(); 
            isMetroOn = !isMetroOn; 
            const btn = document.getElementById('metro-btn');
            
            if (isMetroOn) { 
                btn.style.color = "var(--fl-orange)"; btn.innerText = "METRO ON"; 
                metroBeat = 0; 
                nextAudioTime = audioCtx.currentTime + 0.05; 
            } else { 
                btn.style.color = "#fff"; btn.innerText = "METRO OFF"; 
            }
        }

        function updateTempo() { document.getElementById('bpm-val').innerText = document.getElementById('bpm-slider').value; }

        // LOCAL STORAGE
        let registrations = new Array(16).fill(null);
        let isStoreMode = false;
        const regContainer = document.getElementById('reg-container');
        for (let i = 0; i < 16; i++) regContainer.innerHTML += `<div class="pad pad-reg" id="btn-reg-${i}" onclick="handleRegPad(${i})">R${i+1}</div>`;

        function loadSavedBanks() {
            const savedData = localStorage.getItem('jdaw_custom_tones');
            if (savedData) {
                registrations = JSON.parse(savedData);
                registrations.forEach((reg, index) => { if (reg !== null) document.getElementById(`btn-reg-${index}`).classList.add('saved'); });
            }
        }
        window.addEventListener('load', loadSavedBanks);

        function toggleStoreMode() {
            isStoreMode = !isStoreMode;
            document.getElementById('btn-reg-store').classList.toggle('active', isStoreMode);
        }

        function handleRegPad(index) {
            let pad = document.getElementById(`btn-reg-${index}`);
            if (isStoreMode) {
                let t = tracks[activeTrackIndex];
                registrations[index] = { programNumber: globalCurrentTone, params: { ...t.params } };
                localStorage.setItem('jdaw_custom_tones', JSON.stringify(registrations));
                pad.classList.add('saved'); toggleStoreMode();
                let btnStore = document.getElementById('btn-reg-store');
                btnStore.innerText = "SAVED!"; setTimeout(() => btnStore.innerText = "STORE", 1000);
            } else {
                let reg = registrations[index]; if (!reg) return; 
                if (midiOutput && reg.programNumber !== "---") midiOutput.send([0xC0 | tracks[activeTrackIndex].channel, parseInt(reg.programNumber) - 1]);
                globalCurrentTone = reg.programNumber; document.getElementById('current-tone').innerText = reg.programNumber;
                let t = tracks[activeTrackIndex]; t.params = { ...reg.params }; syncUIToTrack(t);
                for (let cc in t.params) if (midiOutput) midiOutput.send([0xB0 | tracks[activeTrackIndex].channel, parseInt(cc), t.params[cc]]);
            }
        }

        // ==========================================
        // === V27 MASTER SEQUENCER ENGINE ==========
        // ==========================================
        let tracks = []; const tracksContainer = document.getElementById('tracks-container');
        for (let i = 0; i < 16; i++) {
            // Added overdubBuffer array
            tracks.push({ id: i, channel: i, state: "EMPTY", data: [], overdubBuffer: [], duration: 0, recordStartTime: 0, activeNotes: [], params: getDefaultParams() });
            let label = (i === 9) ? "DRUM" : `T${i+1}`;
            tracksContainer.innerHTML += `<div class="pad ${i===0 ? 'selected' : ''}" id="btn-trk-${i}" onclick="selectTrack(${i})">${label}</div>`;
        }

        function selectTrack(index) {
            activeTrackIndex = index;
            for (let i = 0; i < 16; i++) {
                let btn = document.getElementById(`btn-trk-${i}`);
                if (i === index) btn.classList.add('selected'); else btn.classList.remove('selected');
            }
            
            let t = tracks[activeTrackIndex];
            document.getElementById('display-active-track').innerText = (index === 9) ? "DRUMS (CH10)" : `TRK ${index+1}`;
            document.getElementById('current-tone').innerText = t.params.program !== undefined ? t.params.program : "---";
            syncUIToTrack(t); updateActionButtonsUI();
            
            if (midiOutput && t.params.program !== "---") {
                midiOutput.send([0xC0 | t.channel, parseInt(t.params.program) - 1]);
                for (let cc in t.params) if (cc !== 'program') midiOutput.send([0xB0 | t.channel, parseInt(cc), t.params[cc]]);
            }
        }

        function updateTrackStatusUI(index) {
            let t = tracks[index]; let btn = document.getElementById(`btn-trk-${index}`);
            btn.classList.remove('s-ARMED', 's-RECORDING', 's-OVERDUB', 's-PLAYING', 's-STOPPED');
            if (t.state !== "EMPTY") btn.classList.add(`s-${t.state}`);
            if (activeTrackIndex === index) updateActionButtonsUI();
        }

        function updateActionButtonsUI() {
            let t = tracks[activeTrackIndex]; let btnRec = document.getElementById('loop-rec'); let btnPlay = document.getElementById('loop-play');
            btnRec.classList.remove('active'); btnPlay.classList.remove('active');
            if (t.state === "ARMED" || t.state === "RECORDING" || t.state === "OVERDUB") btnRec.classList.add('active');
            if (t.state === "PLAYING") btnPlay.classList.add('active');
        }

        function ensureTransportRunning() {
            if (!isTransportRunning) {
                globalTransportStart = getGlobalTime();
                isTransportRunning = true;
            }
        }

        function finalizeLoop(t) {
            // Only set duration if this is the FIRST recording pass
            if (t.duration === 0) {
                let durationMs = getGlobalTime() - t.recordStartTime;
                if (isMetroOn) {
                    let bpm = parseFloat(document.getElementById('bpm-slider').value); 
                    let measureMs = (60000 / bpm) * 4; 
                    let completedMeasures = Math.max(1, Math.round(durationMs / measureMs)); 
                    t.duration = completedMeasures * measureMs;
                } else {
                    t.duration = durationMs; 
                }
            }

            // V27 OVERDUB MERGE: Move buffer to main array
            t.data = t.data.concat(t.overdubBuffer);
            t.overdubBuffer = [];

            let cleanData = [];
            let activeKeys = {};
            
            t.data.forEach(ev => {
                let wrappedTime = ev.time % t.duration;
                cleanData.push({ data: ev.data, time: wrappedTime });
                let cmd = ev.data[0] & 0xF0; let note = ev.data[1]; let vel = ev.data[2];
                if (cmd === 0x90 && vel > 0) activeKeys[note] = true;
                else if (cmd === 0x80 || (cmd === 0x90 && vel === 0)) delete activeKeys[note];
            });
            
            // V27 MUSICAL BLEED MATH
            let bpm = parseFloat(document.getElementById('bpm-slider').value); 
            let bleedMs = (60000 / bpm) / 4; // Exactly one 16th note bleed
            
            for (let note in activeKeys) {
                cleanData.push({ data: new Uint8Array([0x80 | t.channel, parseInt(note), 0]), time: bleedMs });
            }
            
            t.data = cleanData.sort((a,b) => a.time - b.time);
            t.activeNotes = []; 
        }

        function toggleLooperRec() {
            initAudio(); 
            let t = tracks[activeTrackIndex];
            
            if (t.state === "RECORDING" || t.state === "OVERDUB") { 
                if (t.data.length > 0 || t.overdubBuffer.length > 0) finalizeLoop(t);
                t.state = "PLAYING"; document.getElementById('looper-status').innerText = "LOOPING"; 
            } 
            else if (t.state === "PLAYING") {
                t.state = "OVERDUB"; document.getElementById('looper-status').innerText = "OVERDUBBING"; 
            }
            else if (t.state === "STOPPED" && t.data.length > 0) { 
                ensureTransportRunning();
                t.state = "OVERDUB"; document.getElementById('looper-status').innerText = "OVERDUBBING"; 
            }
            else if (t.state === "ARMED") {
                t.state = "EMPTY"; document.getElementById('looper-status').innerText = "READY";
            }
            else { 
                t.state = "ARMED"; t.data = []; t.overdubBuffer = []; t.duration = 0; stopTrackNotes(t); 
                document.getElementById('looper-status').innerText = isMetroOn ? "WAITING FOR BEAT 1..." : "ARMED..."; 
            }
            updateTrackStatusUI(activeTrackIndex);
        }

        function toggleLooperPlay() {
            let t = tracks[activeTrackIndex];
            if (t.state === "PLAYING") { 
                t.state = "STOPPED"; stopTrackNotes(t); document.getElementById('looper-status').innerText = "STOPPED"; 
            } 
            else if (t.state === "RECORDING" || t.state === "OVERDUB") {
                if (t.data.length > 0 || t.overdubBuffer.length > 0) finalizeLoop(t);
                t.state = "PLAYING"; document.getElementById('looper-status').innerText = "LOOPING";
            } 
            else if (t.state === "STOPPED" && t.data.length > 0) { 
                ensureTransportRunning(); // MASTER SYNC HAPPENS HERE
                t.state = "PLAYING"; document.getElementById('looper-status').innerText = "LOOPING"; 
            }
            else if (t.state === "ARMED") {
                t.state = "EMPTY"; document.getElementById('looper-status').innerText = "READY";
            }
            
            // If all tracks are stopped, pause the master transport
            let anyRunning = tracks.some(trk => trk.state === "PLAYING" || trk.state === "RECORDING" || trk.state === "OVERDUB");
            if (!anyRunning) { isTransportRunning = false; document.getElementById('master-time').innerText = "0.00s"; }
            
            updateTrackStatusUI(activeTrackIndex);
        }

        function stopAllTracks() {
            tracks.forEach((t, i) => { 
                if (t.state === "PLAYING" || t.state === "RECORDING" || t.state === "OVERDUB" || t.state === "ARMED") { 
                    if ((t.state === "RECORDING" || t.state === "OVERDUB") && (t.data.length > 0 || t.overdubBuffer.length > 0)) finalizeLoop(t);
                    t.state = (t.data.length > 0) ? "STOPPED" : "EMPTY"; stopTrackNotes(t); updateTrackStatusUI(i); 
                }
            });
            isTransportRunning = false;
            document.getElementById('looper-status').innerText = "ALL STOPPED";
            document.getElementById('master-time').innerText = "0.00s";
        }

        function stopTrackNotes(t) {
            if (!midiOutput) return;
            t.activeNotes.forEach(note => { midiOutput.send([0x80 | t.channel, note, 0]); }); t.activeNotes = [];
        }

        // ==========================================
        // === V27 GLOBAL PLAYHEAD CLOCK ============
        // ==========================================
        let lastFrameTime = 0;

        function masterEngine() {
            let nowGlobal = getGlobalTime();
            
            if (isMetroOn && audioCtx) {
                let bpm = parseFloat(document.getElementById('bpm-slider').value);
                let secPerBeat = 60.0 / bpm;
                if (nextAudioTime < audioCtx.currentTime + 0.1) {
                    playClick(metroBeat === 0, nextAudioTime);
                    
                    if (metroBeat === 0) {
                        let offsetMs = (nextAudioTime - audioCtx.currentTime) * 1000;
                        let exactMidiStartTime = nowGlobal + offsetMs;
                        
                        tracks.forEach(t => {
                            if (t.state === "ARMED") {
                                if(!isTransportRunning) { globalTransportStart = exactMidiStartTime; isTransportRunning = true; }
                                t.state = "RECORDING";
                                t.recordStartTime = exactMidiStartTime; 
                                t.data = []; t.overdubBuffer = [];
                                updateTrackStatusUI(t.id);
                                document.getElementById('looper-status').innerText = "REC (SYNCED)";
                            }
                        });
                    }
                    nextAudioTime += secPerBeat;
                    metroBeat = (metroBeat + 1) % 4;
                }
            }
            
            if (isTransportRunning) {
                let masterRunningTime = nowGlobal - globalTransportStart;
                document.getElementById('master-time').innerText = (masterRunningTime / 1000).toFixed(2) + "s";
                
                tracks.forEach(t => {
                    if (t.state === "PLAYING" || t.state === "OVERDUB") {
                        if (t.duration === 0) return; // safety
                        
                        // V27: EVERY track derives its position from the MASTER clock!
                        let currentPos = masterRunningTime % t.duration;
                        let lastPos = lastFrameTime % t.duration;
                        
                        // Time went backwards relative to the loop length = Wrap Around!
                        if (currentPos < lastPos) { 
                            t.data.forEach(ev => { if (ev.time >= lastPos && ev.time < t.duration && midiOutput) midiOutput.send(ev.data); trackPolyphony(t, ev); });
                            
                            // MERGE OVERDUB BUFFER SILENTLY ON BOUNDARY
                            if (t.state === "OVERDUB" && t.overdubBuffer.length > 0) {
                                t.data = t.data.concat(t.overdubBuffer); t.overdubBuffer = [];
                                t.data.sort((a,b) => a.time - b.time);
                            }

                            t.data.forEach(ev => { if (ev.time >= 0 && ev.time <= currentPos && midiOutput) midiOutput.send(ev.data); trackPolyphony(t, ev); });
                        } else { 
                            // NORMAL PLAYBACK
                            t.data.forEach(ev => { if (ev.time > lastPos && ev.time <= currentPos && midiOutput) midiOutput.send(ev.data); trackPolyphony(t, ev); });
                        }
                    }
                });
                lastFrameTime = masterRunningTime;
            }
            requestAnimationFrame(masterEngine); 
        }
        requestAnimationFrame(masterEngine); 

        function trackPolyphony(t, ev) {
            let cmd = ev.data[0] & 0xF0; let note = ev.data[1]; let vel = ev.data[2];
            if (cmd === 0x90 && vel > 0) { if (!t.activeNotes.includes(note)) t.activeNotes.push(note); }
            else if (cmd === 0x80 || (cmd === 0x90 && vel === 0)) { t.activeNotes = t.activeNotes.filter(n => n !== note); }
        }

        // ==========================================
        // === MIDI EVENT ROUTER ====================
        // ==========================================
        if (navigator.requestMIDIAccess) navigator.requestMIDIAccess({ sysex: false }).then(onMIDISuccess, () => document.getElementById('status-bar').innerText = "NO MIDI FOUND");

        function onMIDISuccess(midiAccess) {
            for (let input of midiAccess.inputs.values()) input.onmidimessage = handleMIDIMessage;
            for (let output of midiAccess.outputs.values()) midiOutput = output; 
            if (midiOutput) {
                let el = document.getElementById('status-bar'); el.innerText = "STUDIO LINK ACTIVE"; el.style.background = "var(--fl-green)"; el.style.color = "#000"; el.style.boxShadow = "0 0 15px var(--fl-green)";
            }
        }

        function handleMIDIMessage(message) {
            let type = message.data[0] & 0xF0; let data1 = message.data[1]; let data2 = message.data[2];
            let t = tracks[activeTrackIndex];

            let outData = Array.from(message.data);
            if (type >= 0x80 && type <= 0xE0) { outData[0] = type | t.channel; if (midiOutput) midiOutput.send(outData); }

            const isNoteEvent = (type === 0x80 || type === 0x90); const isNoteOn = (type === 0x90 && data2 > 0);

            if (t.state === "ARMED" && isNoteOn && !isMetroOn) {
                ensureTransportRunning();
                t.state = "RECORDING"; t.recordStartTime = getGlobalTime();
                updateTrackStatusUI(activeTrackIndex); document.getElementById('looper-status').innerText = "RECORDING";
                
                if (!isMetroOn) {
                    initAudio(); isMetroOn = true; 
                    const btn = document.getElementById('metro-btn'); btn.style.color = "var(--fl-orange)"; btn.innerText = "METRO ON";
                    metroBeat = 1; nextAudioTime = audioCtx.currentTime + (60.0 / parseFloat(document.getElementById('bpm-slider').value));
                    playClick(true, audioCtx.currentTime); 
                }
            }
            
            // V27: WRITE TO THE CORRECT MEMORY BANK
            if (type >= 0x80 && type <= 0xE0) { 
                if (t.state === "RECORDING") {
                    const eventTime = getGlobalTime() - t.recordStartTime; 
                    t.data.push({ data: new Uint8Array(outData), time: eventTime });
                }
                else if (t.state === "OVERDUB") {
                    const masterRunningTime = getGlobalTime() - globalTransportStart;
                    const currentPos = masterRunningTime % t.duration;
                    t.overdubBuffer.push({ data: new Uint8Array(outData), time: currentPos });
                }
            }
            
            if (isNoteEvent) { document.getElementById('midi-note').innerText = data1; } 
            else if (type === 0xC0) { 
                globalCurrentTone = data1 + 1; document.getElementById('current-tone').innerText = globalCurrentTone;
                t.params.program = globalCurrentTone; 
                setTimeout(() => { if (midiOutput) { for (let cc in t.params) if (cc !== 'program') midiOutput.send([0xB0 | t.channel, parseInt(cc), t.params[cc]]); } }, 20); 
            }
        }
    </script>
