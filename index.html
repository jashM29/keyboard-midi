<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#121318">
    
    <title>JDAW Mobile (V28 Pro Looper)</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg: #0b0c10; --chassis: #16171d; --panel: #1e1f29; 
            --border: #2a2c3a; --screen: #0d0f12; 
            --daw-orange: #ff7300; --daw-green: #00fa9a; --daw-blue: #00d2ff; --daw-red: #ff3366;
            --text-main: #f8fafc; --text-muted: #64748b;
        }

        body { 
            background: var(--bg); color: var(--text-main); font-family: 'Inter', sans-serif; 
            display: flex; flex-direction: column; align-items: center; padding: 10px; margin: 0; min-height: 100vh;
            overscroll-behavior-y: contain; user-select: none;
        }

        #status-bar { 
            width: 100%; max-width: 1200px; box-sizing: border-box; text-align: center; padding: 8px; 
            background: #8b0000; color: white; border-radius: 4px; margin-bottom: 10px; 
            font-weight: 900; font-size: 0.7rem; letter-spacing: 2px; text-transform: uppercase;
            box-shadow: 0 0 10px rgba(139, 0, 0, 0.5); z-index: 100; transition: 0.3s;
        }

        .daw-chassis {
            background: var(--chassis); border: 1px solid #111; border-top: 1px solid #2a2c3a;
            border-radius: 12px; padding: 15px; box-shadow: 0 20px 50px rgba(0,0,0,0.9);
            width: 100%; max-width: 1200px; box-sizing: border-box; display: grid; gap: 15px;
        }

        @media (min-width: 900px) {
            .daw-chassis { grid-template-columns: 1fr 1fr; padding: 25px; gap: 20px; }
            .full-width { grid-column: 1 / -1; }
        }

        /* DIGITAL TRANSPORT CONSOLE */
        .master-console {
            background: var(--screen); border: 2px solid #050608; border-radius: 8px; padding: 15px;
            display: flex; flex-direction: column; gap: 15px; box-shadow: inset 0 0 20px rgba(0,0,0,0.9);
        }
        @media (min-width: 600px) { .master-console { flex-direction: row; justify-content: space-between; align-items: center; } }

        .oled-group { display: flex; gap: 20px; justify-content: space-between; width: 100%; }
        .oled-block { display: flex; flex-direction: column; font-family: 'Share Tech Mono', monospace; }
        .oled-lbl { color: #516b80; font-size: 0.6rem; font-family: 'Inter', sans-serif; font-weight: 900; letter-spacing: 1px; margin-bottom: 2px;}
        .oled-val { color: var(--daw-blue); font-size: 1.6rem; text-shadow: 0 0 8px rgba(0,210,255,0.4); }
        .oled-val.orange { color: var(--daw-orange); text-shadow: 0 0 8px rgba(255,115,0,0.4); }

        .transport-controls { display: flex; gap: 10px; width: 100%; justify-content: center; }
        .t-btn {
            background: linear-gradient(180deg, #2a2c3a, #1e1f29); border: 1px solid #000; border-top: 1px solid #444; 
            color: #fff; border-radius: 6px; flex-grow: 1; height: 50px; font-size: 1.4rem; cursor: pointer; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.6); touch-action: manipulation;
        }
        .t-btn:active { transform: translateY(2px); box-shadow: 0 1px 2px rgba(0,0,0,0.8); }
        .t-btn.rec.active { background: #3a000d; border-color: var(--daw-red); color: var(--daw-red); box-shadow: 0 0 15px rgba(255,51,102,0.4); }
        .t-btn.play.active { background: #002b16; border-color: var(--daw-green); color: var(--daw-green); box-shadow: 0 0 15px rgba(0,250,154,0.3); }

        /* MODULE BLOCKS */
        .module { background: var(--panel); border: 1px solid #000; border-top: 1px solid #2a2c3a; border-radius: 8px; padding: 15px; box-shadow: inset 0 2px 10px rgba(0,0,0,0.5); }
        .m-title { display: flex; justify-content: space-between; align-items: center; font-size: 0.65rem; color: #828a9f; letter-spacing: 1px; font-weight: 900; border-bottom: 1px solid #2a2c3a; padding-bottom: 6px; margin-bottom: 12px; }

        /* MPC PADS */
        .pad-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
        .pad {
            background: linear-gradient(135deg, #2a2c3a, #1e1f29); border: 1px solid #050608; border-top: 1px solid #3a3d4a; 
            border-radius: 6px; height: 55px; display: flex; justify-content: center; align-items: center; 
            cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.5); font-weight: 900; color: var(--text-muted); 
            font-size: 0.75rem; touch-action: manipulation; transition: 0.1s;
        }
        .pad:active { transform: translateY(3px); box-shadow: 0 1px 2px rgba(0,0,0,0.8); }
        
        .pad.selected { border-color: var(--daw-blue); color: #fff; box-shadow: 0 0 12px rgba(0,210,255,0.3); }
        .pad.s-ARMED { border-color: var(--daw-red); background: #2a0008; color: var(--daw-red); }
        .pad.s-RECORDING { background: var(--daw-red); color: #fff; box-shadow: 0 0 15px rgba(255,51,102,0.6); border-color: #ffb3c6;}
        .pad.s-OVERDUB { background: var(--daw-orange); color: #000; box-shadow: 0 0 15px rgba(255,115,0,0.6); border-color: #ffe6cc;}
        .pad.s-PLAYING { background: var(--daw-green); color: #000; box-shadow: 0 0 15px rgba(0,250,154,0.4); border-color: #ccffcc;}
        .pad.s-STOPPED { color: var(--daw-green); border-color: var(--daw-green); }

        .pad-reg.saved { border-color: #664400; color: var(--daw-orange); background: #2a1a00; }

        .btn-small { background: #1a1c25; color: #fff; border: 1px solid #050608; border-top: 1px solid #3a3d4a; border-radius: 4px; padding: 6px 12px; font-size: 0.65rem; font-weight: 900; cursor: pointer; }
        .btn-small.active { background: var(--daw-red); color: #fff; border-color: #ffb3c6; box-shadow: 0 0 10px rgba(255,51,102,0.5);}

        /* MIXER & SYNTH */
        .strip-input { -webkit-appearance: none; width: 100%; height: 8px; background: #050608; border-radius: 4px; border: 1px solid #111; outline: none; touch-action: none; box-shadow: inset 0 1px 3px rgba(0,0,0,1); }
        .strip-input::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 24px; background: #e2e8f0; border: 2px solid var(--daw-orange); border-radius: 3px; box-shadow: 0 0 8px rgba(255,115,0,0.6); margin-top: -8px;}

        .mixer-scroll { display: flex; gap: 20px; overflow-x: auto; padding: 10px 5px 15px 5px; scroll-snap-type: x mandatory; -webkit-overflow-scrolling: touch; }
        .fader-wrap { display: flex; flex-direction: column; align-items: center; width: 45px; flex-shrink: 0; scroll-snap-align: start; }
        .fader-bg { position: relative; width: 35px; height: 140px; display: flex; justify-content: center; align-items: center; background: #050608; border-radius: 4px; box-shadow: inset 0 0 10px #000; border: 1px solid #1a1c25;}
        .fader-input { -webkit-appearance: none; width: 130px; height: 2px; background: transparent; transform: rotate(-90deg); position: absolute; z-index: 2; touch-action: none; }
        .fader-input::-webkit-slider-thumb { -webkit-appearance: none; width: 30px; height: 45px; background: linear-gradient(to right, #1a1c25, #3a3d4a, #1a1c25); border: 1px solid #000; border-top: 1px solid #555; border-radius: 3px; box-shadow: 0 6px 12px rgba(0,0,0,0.8); background-image: linear-gradient(to bottom, transparent 46%, var(--daw-blue) 46%, var(--daw-blue) 54%, transparent 54%); }
        .fader-val { margin-top: 10px; font-size: 0.7rem; color: var(--daw-blue); font-family: monospace; background: #050608; padding: 3px 6px; border-radius: 3px; border: 1px solid #1a1c25;}
    </style>
</head>
<body>

    <div id="status-bar">MIDI DISCONNECTED</div>

    <div class="daw-chassis">
        
        <!-- MASTER CONSOLE -->
        <div class="master-console full-width">
            <div class="oled-group">
                <div class="oled-block">
                    <span class="oled-lbl">BEAT SYNC</span>
                    <span class="oled-val orange" id="master-time">1:1</span>
                </div>
                <div class="oled-block">
                    <span class="oled-lbl">EDIT TARGET</span>
                    <span class="oled-val" id="display-active-track" style="color:#fff;">TRK 1</span>
                </div>
                <div class="oled-block" style="text-align: right;">
                    <span class="oled-lbl">CASIO TONE</span>
                    <span class="oled-val" id="current-tone">---</span>
                </div>
            </div>
            <div class="transport-controls">
                <button class="t-btn rec" id="loop-rec" onclick="toggleLooperRec()">⏺</button>
                <button class="t-btn play" id="loop-play" onclick="toggleLooperPlay()">⏵</button>
                <button class="t-btn stop" onclick="stopAllTracks()">⏹</button>
            </div>
        </div>

        <!-- LEFT COL: LOOPER & REG -->
        <div style="display: flex; flex-direction: column; gap: 15px;">
            <div class="module" style="border-top-color: var(--daw-green);">
                <div class="m-title">
                    <span style="color:var(--daw-green);">16-TRACK AUTO-MEASURE LOOPER</span>
                    <span id="looper-status" style="color:#fff;">READY</span>
                </div>
                <div class="pad-grid" id="tracks-container"></div>
            </div>

            <div class="module" style="border-top-color: var(--daw-orange);">
                <div class="m-title">
                    <span style="color:var(--daw-orange);">REGISTRATION SNAPSHOTS</span>
                    <button id="btn-reg-store" class="btn-small" onclick="toggleStoreMode()">STORE</button>
                </div>
                <div class="pad-grid" id="reg-container"></div>
            </div>
        </div>

        <!-- RIGHT COL: MIXER & SYNTH -->
        <div style="display: flex; flex-direction: column; gap: 15px;">
            <div class="module" style="border-top-color: var(--daw-blue);">
                <div class="m-title"><span style="color:var(--daw-blue);">CONSOLE MIXER ➔</span></div>
                <div class="mixer-scroll" id="sliders-container"></div>
            </div>

            <div style="display: grid; grid-template-columns: 110px 1fr; gap: 15px;">
                <div class="module" style="border-top-color: #fff; padding: 12px;">
                    <div class="m-title">TEMPO</div>
                    <span id="bpm-val" class="oled-val orange" style="font-size:1.3rem; display:block; margin-bottom:8px;">100</span>
                    <input type="range" class="strip-input" id="bpm-slider" min="60" max="200" value="100" oninput="updateTempo()" style="margin-bottom: 20px;">
                    <button class="btn-small" id="metro-btn" onclick="toggleMetronome()" style="width:100%;">METRO OFF</button>
                </div>

                <div class="module" style="border-top-color: #fff;">
                    <div class="m-title">SYNTHESIS ENGINE</div>
                    <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px;" id="knobs-container"></div>
                </div>
            </div>
        </div>

    </div>

    <script>
        // ==========================================
        // === V28 PURE MATHEMATICAL CLOCK ==========
        // ==========================================
        let midiOutput = null; 
        let activeTrackIndex = 0; 
        let globalCurrentTone = "---"; 
        
        let audioCtx = null;
        let isMetroOn = false; 
        let nextClickMasterTime = 0; 
        
        // The one true clock. Everything snaps to this grid.
        let globalTransportStart = null; 
        let isTransportRunning = false;

        const knobMappings = [
            { id: "K1", name: "Cutoff", cc: 74, default: 64 }, { id: "K2", name: "Reso", cc: 71, default: 64 },
            { id: "K3", name: "Attack", cc: 73, default: 64 }, { id: "K4", name: "Decay", cc: 75, default: 64 },
            { id: "K5", name: "Release", cc: 72, default: 64 }, { id: "K6", name: "Vibrato", cc: 76, default: 64 }
        ];

        const sliderMappings = [
            { id: "S1", name: "Vol", cc: 7, default: 100 }, { id: "S2", name: "Pan", cc: 10, default: 64 },
            { id: "S3", name: "Reverb", cc: 91, default: 40 }, { id: "S4", name: "Chorus", cc: 93, default: 0 },
            { id: "S5", name: "Mod", cc: 1, default: 0 }, { id: "S6", name: "Expr", cc: 11, default: 127 },
            { id: "S7", name: "VibDep", cc: 77, default: 64 }, { id: "S8", name: "VibDel", cc: 78, default: 64 }
        ];

        function getDefaultParams() {
            let p = {};
            knobMappings.forEach(k => p[k.cc] = k.default);
            sliderMappings.forEach(s => p[s.cc] = s.default);
            return p;
        }

        // UI RENDERING
        const knobsContainer = document.getElementById('knobs-container');
        knobMappings.forEach(k => {
            knobsContainer.innerHTML += `
                <div style="display:flex; flex-direction:column; gap:6px;">
                    <div style="display:flex; justify-content:space-between; font-size:0.6rem; color:#888; font-weight:900;"><span>${k.name}</span> <span id="display-${k.id}" style="color:var(--daw-orange);">${k.default}</span></div>
                    <input type="range" class="strip-input" id="${k.id}" min="0" max="127" value="${k.default}" oninput="handleControlMove('${k.id}', ${k.cc}, this.value)">
                </div>`;
        });

        const slidersContainer = document.getElementById('sliders-container');
        sliderMappings.forEach(s => {
            slidersContainer.innerHTML += `
                <div class="fader-wrap">
                    <span style="font-size:0.6rem; color:#888; font-weight:900; margin-bottom:8px;">${s.name}</span>
                    <div class="fader-bg"><input type="range" class="fader-input" id="${s.id}" min="0" max="127" value="${s.default}" oninput="handleControlMove('${s.id}', ${s.cc}, this.value)"></div>
                    <span id="display-${s.id}" class="fader-val">${s.default}</span>
                </div>`;
        });

        function syncUIToTrack(trackObj) {
            knobMappings.forEach(k => { let val = trackObj.params[k.cc]; document.getElementById(k.id).value = val; document.getElementById(`display-${k.id}`).innerText = val; });
            sliderMappings.forEach(s => { let val = trackObj.params[s.cc]; document.getElementById(s.id).value = val; document.getElementById(`display-${s.id}`).innerText = val; });
        }

        function handleControlMove(controlId, ccNumber, value) {
            document.getElementById(`display-${controlId}`).innerText = value; let val = parseInt(value);
            let t = tracks[activeTrackIndex]; t.params[ccNumber] = val; 
            if (midiOutput) midiOutput.send([0xB0 | t.channel, ccNumber, val]);
        }

        function initAudio() { 
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); 
            if (audioCtx.state === 'suspended') audioCtx.resume(); 
        }

        function playClick(isDownbeat, scheduleTime) {
            if (!audioCtx) return; 
            const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination); 
            osc.type = "square"; osc.frequency.value = isDownbeat ? 1000 : 500;
            gain.gain.setValueAtTime(0.1, scheduleTime); 
            gain.gain.exponentialRampToValueAtTime(0.001, scheduleTime + 0.05);
            osc.start(scheduleTime); osc.stop(scheduleTime + 0.05);
        }

        function toggleMetronome() {
            initAudio(); 
            isMetroOn = !isMetroOn; 
            const btn = document.getElementById('metro-btn');
            
            if (isMetroOn) { 
                btn.style.color = "var(--daw-orange)"; btn.innerText = "METRO ON"; 
                // If transport isn't running, starting the metro sets the global grid immediately
                if (!isTransportRunning) {
                    globalTransportStart = performance.now();
                    isTransportRunning = true;
                }
                // Calculate next beat time
                let bpm = parseFloat(document.getElementById('bpm-slider').value);
                let beatMs = 60000 / bpm;
                let masterTime = performance.now() - globalTransportStart;
                nextClickMasterTime = Math.ceil(masterTime / beatMs) * beatMs;
            } else { 
                btn.style.color = "#fff"; btn.innerText = "METRO OFF"; 
            }
        }

        function updateTempo() { document.getElementById('bpm-val').innerText = document.getElementById('bpm-slider').value; }

        // LOCAL STORAGE
        let registrations = new Array(16).fill(null);
        let isStoreMode = false;
        const regContainer = document.getElementById('reg-container');
        for (let i = 0; i < 16; i++) regContainer.innerHTML += `<div class="pad pad-reg" id="btn-reg-${i}" onclick="handleRegPad(${i})">R${i+1}</div>`;

        function loadSavedBanks() {
            const savedData = localStorage.getItem('jdaw_custom_tones');
            if (savedData) {
                registrations = JSON.parse(savedData);
                registrations.forEach((reg, index) => { if (reg !== null) document.getElementById(`btn-reg-${index}`).classList.add('saved'); });
            }
        }
        window.addEventListener('load', loadSavedBanks);

        function toggleStoreMode() {
            isStoreMode = !isStoreMode;
            document.getElementById('btn-reg-store').classList.toggle('active', isStoreMode);
        }

        function handleRegPad(index) {
            let pad = document.getElementById(`btn-reg-${index}`);
            if (isStoreMode) {
                let t = tracks[activeTrackIndex];
                registrations[index] = { programNumber: globalCurrentTone, params: { ...t.params } };
                localStorage.setItem('jdaw_custom_tones', JSON.stringify(registrations));
                pad.classList.add('saved'); toggleStoreMode();
                let btnStore = document.getElementById('btn-reg-store');
                btnStore.innerText = "SAVED!"; setTimeout(() => btnStore.innerText = "STORE", 1000);
            } else {
                let reg = registrations[index]; if (!reg) return; 
                if (midiOutput && reg.programNumber !== "---") midiOutput.send([0xC0 | tracks[activeTrackIndex].channel, parseInt(reg.programNumber) - 1]);
                globalCurrentTone = reg.programNumber; document.getElementById('current-tone').innerText = reg.programNumber;
                let t = tracks[activeTrackIndex]; t.params = { ...reg.params }; syncUIToTrack(t);
                for (let cc in t.params) if (midiOutput) midiOutput.send([0xB0 | tracks[activeTrackIndex].channel, parseInt(cc), t.params[cc]]);
            }
        }

        // ==========================================
        // === V28 INDEPENDENT AUTO-MEASURE ENGINE ==
        // ==========================================
        let tracks = []; const tracksContainer = document.getElementById('tracks-container');
        for (let i = 0; i < 16; i++) {
            // rawBuffer collects absolute master times. data stores phase modulo times.
            tracks.push({ id: i, channel: i, state: "EMPTY", data: [], rawBuffer: [], recordActiveNotes: new Set(), duration: 0, activeNotes: [], params: getDefaultParams(), lastPlayTime: 0 });
            let label = (i === 9) ? "DRUMS" : `TRK ${i+1}`;
            tracksContainer.innerHTML += `<div class="pad ${i===0 ? 'selected' : ''}" id="btn-trk-${i}" onclick="selectTrack(${i})">${label}</div>`;
        }

        function selectTrack(index) {
            activeTrackIndex = index;
            for (let i = 0; i < 16; i++) {
                let btn = document.getElementById(`btn-trk-${i}`);
                if (i === index) btn.classList.add('selected'); else btn.classList.remove('selected');
            }
            
            let t = tracks[activeTrackIndex];
            document.getElementById('display-active-track').innerText = (index === 9) ? "DRUMS (CH10)" : `TRK ${index+1}`;
            document.getElementById('current-tone').innerText = t.params.program !== undefined ? t.params.program : "---";
            syncUIToTrack(t); updateActionButtonsUI();
            
            if (midiOutput && t.params.program !== "---") {
                midiOutput.send([0xC0 | t.channel, parseInt(t.params.program) - 1]);
                for (let cc in t.params) if (cc !== 'program') midiOutput.send([0xB0 | t.channel, parseInt(cc), t.params[cc]]);
            }
        }

        function updateTrackStatusUI(index) {
            let t = tracks[index]; let btn = document.getElementById(`btn-trk-${index}`);
            btn.classList.remove('s-ARMED', 's-RECORDING', 's-OVERDUB', 's-PLAYING', 's-STOPPED');
            if (t.state !== "EMPTY") btn.classList.add(`s-${t.state}`);
            if (activeTrackIndex === index) updateActionButtonsUI();
        }

        function updateActionButtonsUI() {
            let t = tracks[activeTrackIndex]; let btnRec = document.getElementById('loop-rec'); let btnPlay = document.getElementById('loop-play');
            btnRec.classList.remove('active'); btnPlay.classList.remove('active');
            if (t.state === "ARMED" || t.state === "RECORDING" || t.state === "OVERDUB") btnRec.classList.add('active');
            if (t.state === "PLAYING") btnPlay.classList.add('active');
        }

        function finalizeLoop(t) {
            let masterTime = performance.now() - globalTransportStart;
            
            // V28 AUTO-MEASURE LOGIC
            if (t.duration === 0) { // Calculate duration only on first record pass
                // Measure how long they actually played from the very first note
                let firstNoteTime = t.rawBuffer.length > 0 ? t.rawBuffer[0].absoluteTime : masterTime;
                let rawDur = masterTime - firstNoteTime;
                
                let bpm = parseFloat(document.getElementById('bpm-slider').value); 
                let measureMs = (60000 / bpm) * 4; 
                
                // Magic snapping: Round what they played to nearest exact measure length
                t.duration = Math.max(1, Math.round(rawDur / measureMs)) * measureMs;
            }

            // Close any hanging notes exactly at the boundary before modulo mapping
            t.recordActiveNotes.forEach(note => {
                t.rawBuffer.push({ data: new Uint8Array([0x80 | t.channel, parseInt(note), 0]), absoluteTime: masterTime });
            });
            t.recordActiveNotes.clear();

            // PHASE-LOCK MODULO: Maps absolute time into repeating loop phase
            t.rawBuffer.forEach(ev => {
                t.data.push({ data: ev.data, time: ev.absoluteTime % t.duration });
            });
            
            t.rawBuffer = [];
            t.data.sort((a,b) => a.time - b.time);
            t.activeNotes = []; 
            t.lastPlayTime = masterTime % t.duration; 
        }

        function toggleLooperRec() {
            initAudio(); 
            let t = tracks[activeTrackIndex];
            
            if (t.state === "RECORDING" || t.state === "OVERDUB") { 
                if (t.rawBuffer.length > 0 || t.data.length > 0) {
                    finalizeLoop(t);
                    t.state = "PLAYING"; document.getElementById('looper-status').innerText = "LOOPING"; 
                } else {
                    t.state = "EMPTY"; document.getElementById('looper-status').innerText = "READY"; 
                }
            } 
            else if (t.state === "PLAYING") {
                t.state = "OVERDUB"; document.getElementById('looper-status').innerText = "OVERDUBBING"; 
            }
            else if (t.state === "STOPPED" && t.data.length > 0) { 
                if (!isTransportRunning) { globalTransportStart = performance.now(); isTransportRunning = true; }
                t.state = "OVERDUB"; document.getElementById('looper-status').innerText = "OVERDUBBING"; 
            }
            else if (t.state === "ARMED") {
                t.state = "EMPTY"; document.getElementById('looper-status').innerText = "READY";
            }
            else { 
                t.state = "ARMED"; t.data = []; t.rawBuffer = []; t.duration = 0; stopTrackNotes(t); 
                document.getElementById('looper-status').innerText = "ARMED (PLAY TO START)"; 
            }
            updateTrackStatusUI(activeTrackIndex);
        }

        function toggleLooperPlay() {
            let t = tracks[activeTrackIndex];
            if (t.state === "PLAYING") { 
                t.state = "STOPPED"; stopTrackNotes(t); document.getElementById('looper-status').innerText = "STOPPED"; 
            } 
            else if (t.state === "RECORDING" || t.state === "OVERDUB") {
                if (t.rawBuffer.length > 0 || t.data.length > 0) finalizeLoop(t);
                t.state = "PLAYING"; document.getElementById('looper-status').innerText = "LOOPING";
            } 
            else if (t.state === "STOPPED" && t.data.length > 0) { 
                if (!isTransportRunning) { globalTransportStart = performance.now(); isTransportRunning = true; }
                t.state = "PLAYING"; document.getElementById('looper-status').innerText = "LOOPING"; 
            }
            else if (t.state === "ARMED") {
                t.state = "EMPTY"; document.getElementById('looper-status').innerText = "READY";
            }
            
            // If all stopped, pause master clock
            let anyRunning = tracks.some(trk => trk.state === "PLAYING" || trk.state === "RECORDING" || trk.state === "OVERDUB");
            if (!anyRunning) { isTransportRunning = false; document.getElementById('master-time').innerText = "1:1"; }
            
            updateTrackStatusUI(activeTrackIndex);
        }

        function stopAllTracks() {
            tracks.forEach((t, i) => { 
                if (t.state === "PLAYING" || t.state === "RECORDING" || t.state === "OVERDUB" || t.state === "ARMED") { 
                    if ((t.state === "RECORDING" || t.state === "OVERDUB") && (t.data.length > 0 || t.rawBuffer.length > 0)) finalizeLoop(t);
                    t.state = (t.data.length > 0) ? "STOPPED" : "EMPTY"; stopTrackNotes(t); updateTrackStatusUI(i); 
                }
            });
            isTransportRunning = false;
            document.getElementById('looper-status').innerText = "ALL STOPPED";
            document.getElementById('master-time').innerText = "1:1";
            if (isMetroOn) toggleMetronome(); // Kill metro on full stop
        }

        function stopTrackNotes(t) {
            if (!midiOutput) return;
            t.activeNotes.forEach(note => { midiOutput.send([0x80 | t.channel, note, 0]); }); t.activeNotes = [];
            t.recordActiveNotes.forEach(note => { midiOutput.send([0x80 | t.channel, note, 0]); }); t.recordActiveNotes.clear();
        }

        // ==========================================
        // === V28 BULLETPROOF MASTER ENGINE ========
        // ==========================================
        function masterEngine() {
            let nowGlobal = performance.now();
            
            if (isTransportRunning) {
                let masterTime = nowGlobal - globalTransportStart;
                
                // UPDATE VISUAL BARS:BEATS DISPLAY
                let bpm = parseFloat(document.getElementById('bpm-slider').value);
                let beatMs = 60000 / bpm;
                let totalBeats = Math.floor(masterTime / beatMs);
                let bar = Math.floor(totalBeats / 4) + 1;
                let beat = (totalBeats % 4) + 1;
                document.getElementById('master-time').innerText = `${bar}:${beat}`;
                
                // METRONOME (Audio Chip Sync)
                if (isMetroOn && audioCtx) {
                    if (nextClickMasterTime < masterTime + 100) { // Look ahead 100ms
                        let deltaMs = nextClickMasterTime - masterTime;
                        let scheduleTime = audioCtx.currentTime + (deltaMs / 1000);
                        if (scheduleTime < audioCtx.currentTime) scheduleTime = audioCtx.currentTime;
                        
                        let isDownbeat = (Math.round(nextClickMasterTime / beatMs) % 4 === 0);
                        playClick(isDownbeat, scheduleTime);
                        nextClickMasterTime += beatMs;
                    }
                }
                
                // MIDI LOOP PLAYBACK
                tracks.forEach(t => {
                    if (t.state === "PLAYING" || t.state === "OVERDUB") {
                        if (t.duration === 0) return; 
                        
                        let currentPos = masterTime % t.duration;
                        let lastPos = t.lastPlayTime;
                        
                        // WRAPPED BOUNDARY! (Modulo reset)
                        if (currentPos < lastPos) { 
                            // 1. Play remaining notes to end
                            t.data.forEach(ev => { if (ev.time > lastPos && ev.time < t.duration && midiOutput) midiOutput.send(ev.data); trackPolyphony(t, ev); });
                            
                            // (NO GUILLOTINE PURGE! Notes gracefully bleed over boundary)

                            // 2. Play new notes from 0
                            t.data.forEach(ev => { if (ev.time >= 0 && ev.time <= currentPos && midiOutput) midiOutput.send(ev.data); trackPolyphony(t, ev); });
                        } else { 
                            // NORMAL PLAYBACK
                            t.data.forEach(ev => { if (ev.time > lastPos && ev.time <= currentPos && midiOutput) midiOutput.send(ev.data); trackPolyphony(t, ev); });
                        }
                        t.lastPlayTime = currentPos;
                    }
                });
            }
            requestAnimationFrame(masterEngine); 
        }
        requestAnimationFrame(masterEngine); 

        function trackPolyphony(t, ev) {
            let cmd = ev.data[0] & 0xF0; let note = ev.data[1]; let vel = ev.data[2];
            if (cmd === 0x90 && vel > 0) { if (!t.activeNotes.includes(note)) t.activeNotes.push(note); }
            else if (cmd === 0x80 || (cmd === 0x90 && vel === 0)) { t.activeNotes = t.activeNotes.filter(n => n !== note); }
        }

        // ==========================================
        // === MIDI EVENT ROUTER ====================
        // ==========================================
        if (navigator.requestMIDIAccess) navigator.requestMIDIAccess({ sysex: false }).then(onMIDISuccess, () => {
            let el = document.getElementById('status-bar'); el.innerText = "NO MIDI FOUND"; el.style.background = "var(--daw-red)";
        });

        function onMIDISuccess(midiAccess) {
            for (let input of midiAccess.inputs.values()) input.onmidimessage = handleMIDIMessage;
            for (let output of midiAccess.outputs.values()) midiOutput = output; 
            if (midiOutput) {
                let el = document.getElementById('status-bar'); el.innerText = "STUDIO LINK ACTIVE"; el.style.background = "var(--daw-green)"; el.style.color = "#000"; el.style.boxShadow = "0 0 15px var(--daw-green)";
            }
        }

        function handleMIDIMessage(message) {
            let type = message.data[0] & 0xF0; let data1 = message.data[1]; let data2 = message.data[2];
            let t = tracks[activeTrackIndex];

            let outData = Array.from(message.data);
            if (type >= 0x80 && type <= 0xE0) { outData[0] = type | t.channel; if (midiOutput) midiOutput.send(outData); }

            const isNoteEvent = (type === 0x80 || type === 0x90); const isNoteOn = (type === 0x90 && data2 > 0); const isNoteOff = (type === 0x80 || (type === 0x90 && data2 === 0));

            // V28 INDEPENDENT TRIGGER: Starts global grid instantly on first keypress
            if (t.state === "ARMED" && isNoteOn) {
                if (!isTransportRunning) { globalTransportStart = performance.now(); isTransportRunning = true; }
                t.state = "RECORDING"; 
                updateTrackStatusUI(activeTrackIndex); document.getElementById('looper-status').innerText = "RECORDING";
            }
            
            // RECORDING & OVERDUBBING
            if (type >= 0x80 && type <= 0xE0) { 
                if (t.state === "RECORDING" || t.state === "OVERDUB") {
                    let masterTime = performance.now() - globalTransportStart;
                    t.rawBuffer.push({ data: new Uint8Array(outData), absoluteTime: masterTime });
                    
                    if (isNoteOn) t.recordActiveNotes.add(data1);
                    if (isNoteOff) t.recordActiveNotes.delete(data1);
                }
            }
            
            if (isNoteEvent) { document.getElementById('midi-note').innerText = data1; } 
            else if (type === 0xC0) { 
                globalCurrentTone = data1 + 1; document.getElementById('current-tone').innerText = globalCurrentTone;
                t.params.program = globalCurrentTone; 
                setTimeout(() => { if (midiOutput) { for (let cc in t.params) if (cc !== 'program') midiOutput.send([0xB0 | t.channel, parseInt(cc), t.params[cc]]); } }, 20); 
            }
        }
    </script>
